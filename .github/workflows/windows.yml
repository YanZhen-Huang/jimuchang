name: Windows Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtwebsockets qthttpserver qtpositioning'
          cache: true

      - name: Diagnose Qt layout
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Get-ChildItem "$env:QT_ROOT_DIR\lib\cmake" -Name | Select-String -Pattern 'WebEngine'

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage and deploy runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\jimuchang.exe dist\
          windeployqt --release --compiler-runtime dist\jimuchang.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\jimuchang.iss'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jimuchang-windows-setup
          path: packaging/windows/Output/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/Output/*.exe
